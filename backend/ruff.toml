# Ruff configuration for Betsim backend
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[lint.isort]
known-first-party = ["models", "schemas", "crud", "api", "simulation", "database", "config"]
